<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpecFloor | Hardware Floor Price Tracker</title>
    <meta name="description" content="SpecFloor - Live floor price tracker and SiliconMark™ rating system for GPUs and CPUs.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #0b0f19; 
            color: #f3f4f6; 
            font-family: 'Inter', sans-serif; 
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .glass-card { 
            background: linear-gradient(135deg, rgba(23, 30, 46, 0.7) 0%, rgba(15, 21, 33, 0.8) 100%);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card:hover {
            border-color: rgba(16, 185, 129, 0.4);
            box-shadow: 0 10px 30px -10px rgba(16, 185, 129, 0.15);
        }
        .glow-accent {
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.2);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 max-w-7xl mx-auto">

    <!-- Top Header -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center pb-6 mb-6 border-b border-gray-800/80 gap-4">
        <div>
            <div class="flex items-center gap-3">
                <h1 class="text-3xl font-extrabold tracking-tight text-white">SpecFloor<span class="text-emerald-500">.</span></h1>
                <span class="bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-semibold px-2.5 py-0.5 rounded-full flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> LIVE TRACKER
                </span>
            </div>
            <p class="text-gray-400 text-sm mt-1">Real-time GPU & CPU Floor Prices • Powered by <span class="text-amber-400 font-semibold">SiliconMark™</span></p>
        </div>

        <!-- Category Toggle Switch -->
        <div class="flex bg-gray-900/90 p-1.5 rounded-xl border border-gray-800">
            <button id="btn-gpu" onclick="setCategory('gpu')" class="px-6 py-2 rounded-lg font-semibold text-sm transition-all bg-emerald-500 text-gray-950 shadow-lg glow-accent">GPUs</button>
            <button id="btn-cpu" onclick="setCategory('cpu')" class="px-6 py-2 rounded-lg font-semibold text-sm transition-all text-gray-400 hover:text-white">CPUs</button>
        </div>
    </header>

    <!-- Stat Metrics Banner -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
        <div class="glass-card p-4 rounded-xl">
            <div class="text-gray-400 text-xs uppercase tracking-wider font-medium">Tracked Hardware</div>
            <div id="stat-count" class="text-2xl font-bold font-mono text-white mt-1">--</div>
        </div>
        <div class="glass-card p-4 rounded-xl">
            <div class="text-gray-400 text-xs uppercase tracking-wider font-medium">Top Value Pick</div>
            <div id="stat-top-pick" class="text-xl font-bold text-amber-400 mt-1 truncate">--</div>
        </div>
        <div class="glass-card p-4 rounded-xl">
            <div class="text-gray-400 text-xs uppercase tracking-wider font-medium">Lowest Floor Price</div>
            <div id="stat-min-price" class="text-2xl font-bold font-mono text-emerald-400 mt-1">--</div>
        </div>
        <div class="glass-card p-4 rounded-xl">
            <div class="text-gray-400 text-xs uppercase tracking-wider font-medium">Market Trend</div>
            <div class="text-2xl font-bold font-mono text-emerald-400 mt-1">↓ Below MSRP</div>
        </div>
    </div>

    <!-- Controls & Filters -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
        <div class="relative">
            <input type="text" id="search" oninput="filterItems()" placeholder="Search model (e.g. 5090, 9800X3D)..." class="w-full glass-card px-4 py-3 rounded-xl text-sm text-white placeholder-gray-500 focus:outline-none focus:border-emerald-500 transition">
        </div>
        
        <select id="vendor-filter" onchange="filterItems()" class="glass-card px-4 py-3 rounded-xl text-sm text-white focus:outline-none focus:border-emerald-500 transition">
            <option value="ALL">All Vendors</option>
        </select>

        <select id="sort-order" onchange="filterItems()" class="glass-card px-4 py-3 rounded-xl text-sm text-white focus:outline-none focus:border-emerald-500 transition">
            <option value="mark-desc">SiliconMark™ Score (High to Low)</option>
            <option value="price-asc">Price (Low to High)</option>
            <option value="price-desc">Price (High to Low)</option>
        </select>
    </div>

    <!-- Hardware Cards Grid -->
    <div id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

    <script>
        let rawData = [];
        let activeCategory = 'gpu';

        async function initSpecFloor() {
            try {
                const res = await fetch('./data.json?t=' + Date.now());
                rawData = await res.json();
                populateVendorFilter();
                filterItems();
            } catch (err) {
                console.error("Error loading SpecFloor dataset:", err);
            }
        }

        function setCategory(cat) {
            activeCategory = cat;
            document.getElementById('btn-gpu').className = cat === 'gpu' ? 'px-6 py-2 rounded-lg font-semibold text-sm transition-all bg-emerald-500 text-gray-950 shadow-lg glow-accent' : 'px-6 py-2 rounded-lg font-semibold text-sm transition-all text-gray-400 hover:text-white';
            document.getElementById('btn-cpu').className = cat === 'cpu' ? 'px-6 py-2 rounded-lg font-semibold text-sm transition-all bg-emerald-500 text-gray-950 shadow-lg glow-accent' : 'px-6 py-2 rounded-lg font-semibold text-sm transition-all text-gray-400 hover:text-white';
            populateVendorFilter();
            filterItems();
        }

        function populateVendorFilter() {
            const select = document.getElementById('vendor-filter');
            const vendors = activeCategory === 'gpu' ? ['NVIDIA', 'AMD'] : ['AMD', 'Intel'];
            select.innerHTML = '<option value="ALL">All Vendors</option>' + vendors.map(v => `<option value="${v}">${v}</option>`).join('');
        }

        function calculateSiliconMark(item) {
            const priceRatio = item.msrp / item.price;
            return Math.min(99, Math.max(60, Math.round(priceRatio * 85)));
        }

        function updateStats(items) {
            if (!items.length) return;
            document.getElementById('stat-count').innerText = items.length;
            const top = [...items].sort((a,b) => b.score - a.score)[0];
            document.getElementById('stat-top-pick').innerText = top ? top.model : '--';
            const lowest = Math.min(...items.map(i => i.price));
            document.getElementById('stat-min-price').innerText = `$${lowest}`;
        }

        function filterItems() {
            const query = document.getElementById('search').value.toLowerCase();
            const vendor = document.getElementById('vendor-filter').value;
            const sort = document.getElementById('sort-order').value;

            let filtered = rawData.filter(item => {
                const matchesCat = item.type === activeCategory;
                const matchesQuery = item.model.toLowerCase().includes(query) || item.family.toLowerCase().includes(query);
                const matchesVendor = vendor === 'ALL' || item.vendor === vendor;
                return matchesCat && matchesQuery && matchesVendor;
            });

            filtered.forEach(i => i.score = calculateSiliconMark(i));

            if (sort === 'mark-desc') filtered.sort((a, b) => b.score - a.score);
            if (sort === 'price-asc') filtered.sort((a, b) => a.price - b.price);
            if (sort === 'price-desc') filtered.sort((a, b) => b.price - a.price);

            updateStats(filtered);
            renderGrid(filtered);
        }

        function renderGrid(items) {
            const grid = document.getElementById('grid');
            if (!items.length) {
                grid.innerHTML = `<div class="col-span-full text-center py-16 text-gray-500 font-medium">No hardware match your selected filter criteria.</div>`;
                return;
            }

            grid.innerHTML = items.map(item => {
                const diff = item.price - item.msrp;
                const diffBadge = diff <= 0 
                    ? `<span class="text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2 py-0.5 rounded font-mono text-xs">-$${Math.abs(diff)} vs MSRP</span>`
                    : `<span class="text-red-400 bg-red-500/10 border border-red-500/20 px-2 py-0.5 rounded font-mono text-xs">+$${diff} vs MSRP</span>`;

                return `
                <div class="glass-card p-6 rounded-2xl flex flex-col justify-between transition-all duration-300">
                    <div>
                        <div class="flex justify-between items-center mb-4">
                            <span class="text-xs font-bold uppercase tracking-wider text-gray-400 bg-gray-800/80 px-2.5 py-1 rounded-md border border-gray-700/50">${item.vendor} • ${item.family}</span>
                            <span class="bg-amber-500/10 border border-amber-500/30 text-amber-400 font-bold px-3 py-1 rounded-lg text-xs">
                                SiliconMark™ <span class="text-amber-300 font-mono text-sm">${item.score}</span>
                            </span>
                        </div>
                        <h3 class="text-xl font-bold text-white mb-1 tracking-tight">${item.model}</h3>
                        <p class="text-gray-400 text-xs mb-6 font-mono">${item.spec}</p>
                    </div>

                    <div class="pt-4 border-t border-gray-800/80">
                        <div class="flex justify-between items-baseline mb-4">
                            <div>
                                <span class="text-3xl font-extrabold text-white font-mono">$${item.price}</span>
                                <span class="text-xs text-gray-500 block">MSRP $${item.msrp}</span>
                            </div>
                            <div>${diffBadge}</div>
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                            <a href="${item.amazon_link}" target="_blank" class="text-center py-2.5 px-3 rounded-xl bg-gray-800/90 hover:bg-emerald-600 hover:text-gray-950 text-xs font-bold text-gray-200 transition">Amazon</a>
                            <a href="${item.newegg_link}" target="_blank" class="text-center py-2.5 px-3 rounded-xl bg-gray-800/90 hover:bg-emerald-600 hover:text-gray-950 text-xs font-bold text-gray-200 transition">Newegg</a>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        document.addEventListener('DOMContentLoaded', initSpecFloor);
    </script>
</body>
</html>
