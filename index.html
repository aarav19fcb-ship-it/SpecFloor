<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpecFloor | Hardware Floor Price Tracker</title>
    <meta name="description" content="SpecFloor - Live floor price tracker and SiliconMark™ rating system for GPUs and CPUs.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #000000; 
            color: #f5f5f7; 
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Apple-style metallic border & translucent card */
        .apple-card { 
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.02) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
        }
        .apple-card:hover {
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9);
        }
        
        /* Metallic text gradient */
        .metallic-text {
            background: linear-gradient(180deg, #ffffff 0%, #8e8e93 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Hardware background image container */
        .card-bg-image {
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease;
            opacity: 0.18;
            filter: grayscale(20%) contrast(120%);
        }
        .apple-card:hover .card-bg-image {
            transform: scale(1.08);
            opacity: 0.32;
        }

        .pill-btn-primary {
            background-color: #0071e3;
            color: #ffffff;
            transition: all 0.2s ease;
        }
        .pill-btn-primary:hover {
            background-color: #0077ed;
            transform: scale(1.02);
        }

        .pill-btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #f5f5f7;
            transition: all 0.2s ease;
        }
        .pill-btn-secondary:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-12 max-w-7xl mx-auto">

    <!-- Header Navigation -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center pb-8 mb-10 border-b border-white/10 gap-6">
        <div>
            <h1 class="text-4xl font-extrabold tracking-tight metallic-text">SpecFloor<span class="text-blue-500">.</span></h1>
            <p class="text-gray-400 text-sm mt-1.5 font-normal tracking-wide">Pro Hardware Floor Tracking • <span class="text-amber-400 font-semibold">SiliconMark™ Score</span></p>
        </div>

        <!-- Category Toggle -->
        <div class="flex bg-white/5 p-1 rounded-full border border-white/10 backdrop-blur-md">
            <button id="btn-gpu" onclick="setCategory('gpu')" class="px-7 py-2 rounded-full font-medium text-sm transition-all pill-btn-primary">GPUs</button>
            <button id="btn-cpu" onclick="setCategory('cpu')" class="px-7 py-2 rounded-full font-medium text-sm transition-all text-gray-400 hover:text-white">CPUs</button>
        </div>
    </header>

    <!-- Top Stats Banner -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10">
        <div class="apple-card p-5 rounded-3xl">
            <div class="text-gray-400 text-xs font-semibold tracking-wider uppercase">Tracked Devices</div>
            <div id="stat-count" class="text-3xl font-bold font-mono text-white mt-1">--</div>
        </div>
        <div class="apple-card p-5 rounded-3xl">
            <div class="text-gray-400 text-xs font-semibold tracking-wider uppercase">Value Leader</div>
            <div id="stat-top-pick" class="text-xl font-bold text-amber-400 mt-1 truncate">--</div>
        </div>
        <div class="apple-card p-5 rounded-3xl">
            <div class="text-gray-400 text-xs font-semibold tracking-wider uppercase">Lowest Floor</div>
            <div id="stat-min-price" class="text-3xl font-bold font-mono text-emerald-400 mt-1">--</div>
        </div>
        <div class="apple-card p-5 rounded-3xl">
            <div class="text-gray-400 text-xs font-semibold tracking-wider uppercase">Market State</div>
            <div class="text-2xl font-bold font-mono text-emerald-400 mt-1">Below MSRP</div>
        </div>
    </div>

    <!-- Search & Filter Controls -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-10">
        <input type="text" id="search" oninput="filterItems()" placeholder="Search GPU or CPU..." class="apple-card px-5 py-3.5 rounded-2xl text-sm text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition">
        
        <select id="vendor-filter" onchange="filterItems()" class="apple-card px-5 py-3.5 rounded-2xl text-sm text-white focus:outline-none focus:border-blue-500 transition">
            <option value="ALL">All Vendors</option>
        </select>

        <select id="sort-order" onchange="filterItems()" class="apple-card px-5 py-3.5 rounded-2xl text-sm text-white focus:outline-none focus:border-blue-500 transition">
            <option value="mark-desc">SiliconMark™ Score (High to Low)</option>
            <option value="price-asc">Price (Low to High)</option>
            <option value="price-desc">Price (High to Low)</option>
        </select>
    </div>

    <!-- Hardware Cards Grid -->
    <div id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>

    <script>
        let rawData = [];
        let activeCategory = 'gpu';

        async function initSpecFloor() {
            try {
                const res = await fetch('./data.json?t=' + Date.now());
                rawData = await res.json();
                populateVendorFilter();
                filterItems();
            } catch (err) {
                console.error("Error loading SpecFloor dataset:", err);
            }
        }

        function setCategory(cat) {
            activeCategory = cat;
            document.getElementById('btn-gpu').className = cat === 'gpu' ? 'px-7 py-2 rounded-full font-medium text-sm transition-all pill-btn-primary' : 'px-7 py-2 rounded-full font-medium text-sm transition-all text-gray-400 hover:text-white';
            document.getElementById('btn-cpu').className = cat === 'cpu' ? 'px-7 py-2 rounded-full font-medium text-sm transition-all pill-btn-primary' : 'px-7 py-2 rounded-full font-medium text-sm transition-all text-gray-400 hover:text-white';
            populateVendorFilter();
            filterItems();
        }

        function populateVendorFilter() {
            const select = document.getElementById('vendor-filter');
            const vendors = activeCategory === 'gpu' ? ['NVIDIA', 'AMD'] : ['AMD', 'Intel'];
            select.innerHTML = '<option value="ALL">All Vendors</option>' + vendors.map(v => `<option value="${v}">${v}</option>`).join('');
        }

        function calculateSiliconMark(item) {
            const priceRatio = item.msrp / item.price;
            return Math.min(99, Math.max(60, Math.round(priceRatio * 85)));
        }

        function updateStats(items) {
            if (!items.length) return;
            document.getElementById('stat-count').innerText = items.length;
            const top = [...items].sort((a,b) => b.score - a.score)[0];
            document.getElementById('stat-top-pick').innerText = top ? top.model : '--';
            const lowest = Math.min(...items.map(i => i.price));
            document.getElementById('stat-min-price').innerText = `$${lowest}`;
        }

        function filterItems() {
            const query = document.getElementById('search').value.toLowerCase();
            const vendor = document.getElementById('vendor-filter').value;
            const sort = document.getElementById('sort-order').value;

            let filtered = rawData.filter(item => {
                const matchesCat = item.type === activeCategory;
                const matchesQuery = item.model.toLowerCase().includes(query) || item.family.toLowerCase().includes(query);
                const matchesVendor = vendor === 'ALL' || item.vendor === vendor;
                return matchesCat && matchesQuery && matchesVendor;
            });

            filtered.forEach(i => i.score = calculateSiliconMark(i));

            if (sort === 'mark-desc') filtered.sort((a, b) => b.score - a.score);
            if (sort === 'price-asc') filtered.sort((a, b) => a.price - b.price);
            if (sort === 'price-desc') filtered.sort((a, b) => b.price - a.price);

            updateStats(filtered);
            renderGrid(filtered);
        }

        function renderGrid(items) {
            const grid = document.getElementById('grid');
            if (!items.length) {
                grid.innerHTML = `<div class="col-span-full text-center py-20 text-gray-500 font-medium">No matching hardware found.</div>`;
                return;
            }

            grid.innerHTML = items.map(item => {
                const diff = item.price - item.msrp;
                const diffBadge = diff <= 0 
                    ? `<span class="text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-3 py-1 rounded-full font-mono text-xs">-$${Math.abs(diff)} vs MSRP</span>`
                    : `<span class="text-red-400 bg-red-500/10 border border-red-500/20 px-3 py-1 rounded-full font-mono text-xs">+$${diff} vs MSRP</span>`;

                return `
                <div class="apple-card relative overflow-hidden p-7 rounded-3xl flex flex-col justify-between transition-all duration-500 group">
                    
                    <!-- Translucent Metallic Background Hardware Image -->
                    <div class="absolute inset-0 z-0 flex items-center justify-center pointer-events-none overflow-hidden">
                        <img src="${item.image}" alt="${item.model}" class="card-bg-image w-full h-full object-cover rounded-3xl" />
                    </div>

                    <!-- Card Content Layer -->
                    <div class="relative z-10">
                        <div class="flex justify-between items-center mb-5">
                            <span class="text-xs font-semibold uppercase tracking-widest text-gray-300 bg-white/10 px-3 py-1 rounded-full border border-white/10 backdrop-blur-md">${item.vendor} • ${item.family}</span>
                            <span class="bg-amber-400/10 border border-amber-400/30 text-amber-300 font-bold px-3 py-1 rounded-full text-xs backdrop-blur-md">
                                SiliconMark™ <span class="text-white font-mono text-sm">${item.score}</span>
                            </span>
                        </div>
                        <h3 class="text-3xl font-extrabold text-white mb-1 tracking-tight metallic-text">${item.model}</h3>
                        <p class="text-gray-400 text-xs mb-6 font-mono">${item.spec}</p>
                    </div>

                    <div class="relative z-10 pt-4 border-t border-white/10">
                        <div class="flex justify-between items-baseline mb-6">
                            <div>
                                <span class="text-4xl font-extrabold text-white font-mono tracking-tight">$${item.price}</span>
                                <span class="text-xs text-gray-400 block font-normal mt-1">MSRP $${item.msrp}</span>
                            </div>
                            <div>${diffBadge}</div>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <a href="${item.amazon_link}" target="_blank" class="text-center py-2.5 px-4 rounded-full pill-btn-primary text-xs font-semibold tracking-wide">Buy Amazon</a>
                            <a href="${item.newegg_link}" target="_blank" class="text-center py-2.5 px-4 rounded-full pill-btn-secondary text-xs font-semibold tracking-wide">Buy Newegg</a>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        document.addEventListener('DOMContentLoaded', initSpecFloor);
    </script>
</body>
</html>
