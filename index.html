<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpecFloor — Hardware Floor Price Tracker</title>
<meta name="description" content="SpecFloor tracks live floor prices and SiliconMark scores for GPUs and CPUs.">
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Patrick+Hand&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0f1015;
    --card-bg: #181920;
    --ink: #f0f0f5;
    --ink-dim: #a0a0b0;
    --ink-faint: #606070;
    --border: #f0f0f5;
    --yellow: #ffd43b;
    --nvidia: #82c91e;
    --amd: #ff6b6b;
    --intel: #339af0;
    --radius: 255px 15px 225px 15px/15px 225px 15px 255px;
    --radius-sm: 20px 5px 20px 5px/5px 20px 5px 20px;
  }

  *{ box-sizing:border-box; }
  body{
    margin:0;
    background: var(--bg);
    background-image: radial-gradient(rgba(255,255,255,0.08) 1px, transparent 1px);
    background-size: 18px 18px;
    color: var(--ink);
    font-family: 'Patrick Hand', cursive, sans-serif;
    font-size: 1.15rem;
    -webkit-font-smoothing: antialiased;
  }

  .mono{ font-family:'JetBrains Mono', monospace; font-size: 0.9em; }
  a{ color:inherit; text-decoration:none; }

  .wrap{ max-width:1180px; margin:0 auto; padding: 28px 20px 80px; }

  header{
    display:flex; justify-content:space-between; align-items:center;
    gap:24px; padding-bottom:20px; margin-bottom:28px;
    border-bottom: 3px dashed var(--border);
    flex-wrap:wrap;
  }

  .wordmark{
    font-family: 'Gaegu', cursive;
    font-size:3.2rem; font-weight:700; color:var(--ink);
    display:flex; align-items:center; gap:8px;
    transform: rotate(-1.5deg);
  }
  .wordmark .dot{ color: var(--yellow); }

  .tagline{ color:var(--ink-dim); font-size:1.2rem; margin-top:-6px; }

  .toggle{
    display:flex; background: var(--card-bg); border: 3px solid var(--border);
    border-radius: var(--radius); padding:4px; gap:6px;
    box-shadow: 4px 4px 0px rgba(255,255,255,0.15);
  }
  .toggle button{
    border: 2px solid transparent; background:transparent; color:var(--ink-dim);
    font: inherit; font-weight:700; font-size:1.2rem;
    padding:6px 22px; border-radius: var(--radius-sm); cursor:pointer;
    transition: transform 0.1s ease, color 0.1s ease;
  }
  .toggle button.active{
    background: var(--yellow); color: #000;
    border-color: var(--border);
    transform: rotate(-1deg) scale(1.03);
  }

  .stats{
    display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:30px;
  }
  .stat{
    background:var(--card-bg); border: 3px solid var(--border);
    border-radius: var(--radius); padding:12px 18px;
    box-shadow: 4px 4px 0px rgba(255,255,255,0.15);
    transform: rotate(0.5deg);
  }
  .stat:nth-child(even){ transform: rotate(-0.7deg); }
  .stat .label{ font-size:1rem; color:var(--ink-faint); font-weight:700; }
  .stat .value{
    font-family: 'Gaegu', cursive;
    font-size:2rem; font-weight:700; line-height: 1; margin-top:2px;
  }

  .controls{
    display:grid; grid-template-columns: 1.4fr 1fr 1fr; gap:16px; margin-bottom:32px;
  }
  .controls input, .controls select{
    width:100%; background: var(--card-bg); border: 3px solid var(--border);
    color:var(--ink); font:inherit; font-size:1.1rem;
    padding:10px 16px; border-radius: var(--radius-sm);
    box-shadow: 3px 3px 0px rgba(255,255,255,0.15);
    outline: none;
  }
  .controls option{ background: #181920; color: #fff; }

  #grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:22px; }
  @media (max-width: 920px){ #grid{ grid-template-columns:repeat(2,1fr); } .stats{ grid-template-columns:repeat(2,1fr);} .controls{ grid-template-columns:1fr; } }
  @media (max-width: 600px){ #grid{ grid-template-columns:1fr; } }

  .card{
    position:relative; overflow:hidden;
    background: var(--card-bg);
    border: 3px solid var(--border);
    border-radius: var(--radius);
    padding:22px;
    display:flex; flex-direction:column; justify-content:space-between;
    min-height:310px;
    box-shadow: 5px 5px 0px rgba(255,255,255,0.15);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .card:nth-child(3n+1){ transform: rotate(-0.5deg); }
  .card:nth-child(3n+2){ transform: rotate(0.6deg); }
  .card:nth-child(3n+3){ transform: rotate(-0.8deg); }

  .card:hover{
    transform: translateY(-4px) scale(1.01) rotate(0deg) !important;
    box-shadow: 7px 7px 0px var(--yellow);
    border-color: var(--yellow);
  }

  .art{
    position:absolute; right: -10px; bottom: -10px; z-index:0;
    opacity:0.18; pointer-events:none;
    transform: rotate(-10deg);
  }
  .art svg{ width:160px; height:160px; fill: none; stroke: var(--border); stroke-width: 2.5; }

  .card-top, .card-bottom{ position:relative; z-index:2; }

  .tag-row{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; }
  .vendor-tag{
    font-size:0.95rem; font-weight:700; color: var(--ink);
    background: #252733; border:2px solid var(--border);
    padding:2px 10px; border-radius: var(--radius-sm);
  }
  .mark-tag{
    font-family: 'Gaegu', cursive;
    font-size:1.2rem; font-weight:700; color: #000;
    background: var(--yellow);
    border:2px solid var(--border);
    padding:2px 10px; border-radius: var(--radius-sm);
  }

  .model-name{
    font-family: 'Gaegu', cursive;
    font-size:2.3rem; font-weight:700; line-height:0.95; margin:0 0 6px;
    color: #ffffff;
  }
  .spec-line{ font-size:1rem; color:var(--ink-dim); margin:0; }

  .card-bottom{ padding-top:12px; border-top:2px dashed var(--border); margin-top:14px; }
  .price-row{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:12px; }
  .price{ font-family: 'Gaegu', cursive; font-size:2.6rem; font-weight:700; line-height:0.8; color: var(--yellow); }
  .msrp{ font-size:0.95rem; color:var(--ink-faint); margin-top:2px; }
  
  .delta{
    font-size:0.95rem; font-weight:700;
    padding:3px 8px; border-radius: var(--radius-sm); border: 2px solid var(--border);
  }
  .delta.down{ background: var(--nvidia); color: #000; }
  .delta.up{ background: var(--amd); color: #fff; }

  .buy-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .buy-row a{
    text-align:center; padding:6px 10px; border-radius: var(--radius-sm);
    font-size:1.1rem; font-weight:700; border: 2px solid var(--border);
    box-shadow: 2px 2px 0px rgba(255,255,255,0.2);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  .buy-primary{ background: var(--yellow); color: #000; }
  .buy-primary:hover{ transform: translate(-1px, -1px); box-shadow: 3px 3px 0px var(--border); }
  .buy-secondary{ background: var(--card-bg); color: var(--ink); }
  .buy-secondary:hover{ transform: translate(-1px, -1px); box-shadow: 3px 3px 0px var(--border); }

  .empty{ grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--ink-faint); font-size:1.4rem; }

  footer{ margin-top:50px; padding-top:20px; border-top: 3px dashed var(--border); color:var(--ink-faint); font-size:1rem; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="wordmark">SpecFloor<span class="dot">.</span></div>
      <div class="tagline">Dark chalk floor prices · <b>SiliconMark</b> score tracker</div>
    </div>
    <div class="toggle">
      <button id="btn-gpu" class="active" onclick="setCategory('gpu')">GPUs</button>
      <button id="btn-cpu" onclick="setCategory('cpu')">CPUs</button>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><div class="label">Tracked</div><div class="value" id="stat-count">—</div></div>
    <div class="stat"><div class="label">Best value</div><div class="value" id="stat-top-pick" style="font-size:1.5rem; color: var(--yellow);">—</div></div>
    <div class="stat"><div class="label">Lowest floor</div><div class="value" id="stat-min-price" style="color:var(--nvidia);">—</div></div>
    <div class="stat"><div class="label">Market trend</div><div class="value" style="color:var(--nvidia); font-size:1.5rem;">↓ Below MSRP</div></div>
  </div>

  <div class="controls">
    <input type="text" id="search" oninput="filterItems()" placeholder="Search model... (e.g. 4090)">
    <select id="vendor-filter" onchange="filterItems()"></select>
    <select id="sort-order" onchange="filterItems()">
      <option value="mark-desc">Sort: SiliconMark (High to Low)</option>
      <option value="price-asc">Sort: Price (Low to High)</option>
      <option value="price-desc">Sort: Price (High to Low)</option>
    </select>
  </div>

  <div id="grid"></div>

  <footer>
    <span>SpecFloor tracks street prices vs MSRP. Not a store!</span>
    <span id="updated-at"></span>
  </footer>
</div>

<script>
let rawData = [];
let activeCategory = 'gpu';

function artFor(type){
  if (type === 'gpu'){
    return `<svg viewBox="0 0 100 100">
      <rect x="10" y="25" width="80" height="50" rx="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="35" cy="50" r="14"/>
      <circle cx="65" cy="50" r="14"/>
      <path d="M 5 35 L 10 35 M 5 65 L 10 65"/>
    </svg>`;
  }
  return `<svg viewBox="0 0 100 100">
    <rect x="25" y="25" width="50" height="50" rx="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="40" y="40" width="20" height="20" rx="2"/>
    <path d="M 35 15 L 35 25 M 50 15 L 50 25 M 65 15 L 65 25 M 35 75 L 35 85 M 50 75 L 50 85 M 65 75 L 65 85"/>
  </svg>`;
}

async function initSpecFloor(){
  try{
    const res = await fetch('./data.json?t=' + Date.now());
    rawData = await res.json();
    populateVendorFilter();
    filterItems();
    const el = document.getElementById('updated-at');
    if (el) el.textContent = 'Updated ' + new Date().toLocaleDateString(undefined, { month:'short', day:'numeric' });
  }catch(err){
    console.error('Error loading dataset:', err);
    document.getElementById('grid').innerHTML = `<div class="empty">Couldn't load data.json! Make sure it sits right next to index.html.</div>`;
  }
}

function setCategory(cat){
  activeCategory = cat;
  document.getElementById('btn-gpu').classList.toggle('active', cat === 'gpu');
  document.getElementById('btn-cpu').classList.toggle('active', cat === 'cpu');
  populateVendorFilter();
  filterItems();
}

function populateVendorFilter(){
  const select = document.getElementById('vendor-filter');
  const vendors = activeCategory === 'gpu' ? ['NVIDIA', 'AMD'] : ['AMD', 'Intel'];
  select.innerHTML = '<option value="ALL">All vendors</option>' +
    vendors.map(v => `<option value="${v}">${v}</option>`).join('');
}

function calculateSiliconMark(item){
  const priceRatio = item.msrp / item.price;
  return Math.min(99, Math.max(60, Math.round(priceRatio * 85)));
}

function updateStats(items){
  if (!items.length){
    document.getElementById('stat-count').textContent = '0';
    document.getElementById('stat-top-pick').textContent = '—';
    document.getElementById('stat-min-price').textContent = '—';
    return;
  }
  document.getElementById('stat-count').textContent = items.length;
  const top = [...items].sort((a,b) => b.score - a.score)[0];
  document.getElementById('stat-top-pick').textContent = top ? top.model : '—';
  const lowest = Math.min(...items.map(i => i.price));
  document.getElementById('stat-min-price').textContent = `$${lowest.toLocaleString()}`;
}

function filterItems(){
  const query = document.getElementById('search').value.toLowerCase().trim();
  const vendor = document.getElementById('vendor-filter').value;
  const sort = document.getElementById('sort-order').value;

  let filtered = rawData.filter(item => {
    const matchesCat = item.type === activeCategory;
    const matchesQuery = !query || item.model.toLowerCase().includes(query) || item.family.toLowerCase().includes(query);
    const matchesVendor = vendor === 'ALL' || !vendor || item.vendor === vendor;
    return matchesCat && matchesQuery && matchesVendor;
  });

  filtered.forEach(i => i.score = calculateSiliconMark(i));

  if (sort === 'mark-desc') filtered.sort((a,b) => b.score - a.score);
  if (sort === 'price-asc') filtered.sort((a,b) => a.price - b.price);
  if (sort === 'price-desc') filtered.sort((a,b) => b.price - a.price);

  updateStats(filtered);
  renderGrid(filtered);
}

function renderGrid(items){
  const grid = document.getElementById('grid');
  if (!items.length){
    grid.innerHTML = `<div class="empty">No hardware matches that search!</div>`;
    return;
  }

  grid.innerHTML = items.map(item => {
    const diff = item.price - item.msrp;
    const deltaBadge = diff <= 0
      ? `<span class="delta down">−$${Math.abs(diff)} MSRP</span>`
      : `<span class="delta up">+$${diff} MSRP</span>`;

    return `
    <div class="card">
      <div class="art">${artFor(item.type)}</div>
      <div class="card-top">
        <div class="tag-row">
          <span class="vendor-tag">${item.vendor} · ${item.family}</span>
          <span class="mark-tag">Score: ${item.score}</span>
        </div>
        <h3 class="model-name">${item.model}</h3>
        <p class="spec-line">${item.spec}</p>
      </div>
      <div class="card-bottom">
        <div class="price-row">
          <div>
            <div class="price">$${item.price.toLocaleString()}</div>
            <div class="msrp">MSRP $${item.msrp.toLocaleString()}</div>
          </div>
          ${deltaBadge}
        </div>
        <div class="buy-row">
          <a class="buy-primary" href="${item.amazon_link}" target="_blank" rel="noopener">Amazon</a>
          <a class="buy-secondary" href="${item.newegg_link}" target="_blank" rel="noopener">Newegg</a>
        </div>
      </div>
    </div>`;
  }).join('');
}

document.addEventListener('DOMContentLoaded', initSpecFloor);
</script>
</body>
</html>
